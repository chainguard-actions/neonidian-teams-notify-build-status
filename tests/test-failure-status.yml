name: Test failure status notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          webhookUrl: "https://example.webhook.office.com/webhookb2/fake-webhook-url"
          message: "Build failed! Please check the logs."
          title: "CI Build Failed"
          titleBackgroundColor: "attention"
          status: "failure"

      - name: Assert action ran for failure status (success or graceful failure on invalid webhook)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded sending failure notification"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid webhook URL expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
