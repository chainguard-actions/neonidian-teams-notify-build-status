name: Test with optional inputs - title, color, and status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhookUrl: 'https://example.webhook.office.com/webhookb2/fake-webhook-url'
          message: 'Build completed successfully'
          title: 'CI Build Status'
          titleBackgroundColor: 'good'
          status: 'success'
      - name: Assert action ran and failed gracefully with fake webhook
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real webhook responded)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake webhook URL"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
