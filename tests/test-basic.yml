name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhookUrl: "https://example.webhook.office.com/webhookb2/fake-webhook-url"
          message: "Build completed successfully"
      - name: Assert action ran (network failure is acceptable in test environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with required inputs webhookUrl and message"
          else
            echo "FAIL: action did not run (outcome was '$OUTCOME')"
            exit 1
          fi
